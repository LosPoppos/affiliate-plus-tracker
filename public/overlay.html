<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=420,height=80,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Plus Points Overlay</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="overlay-page">
  <div id="widget" class="widget" aria-label="Plus Points">
    <div class="widget-top">
      <div class="widget-title-wrap">
        <div id="icon" class="widget-icon star-icon" aria-hidden="true">★</div>
        <div id="title" class="widget-title">AFFILIATE PLUS erreichen!</div>
      </div>
      <div class="widget-value-wrap">
        <div id="value" class="widget-value">0/100</div>
        <div id="label" class="widget-label">Neue Abo-Punkte</div>
      </div>
    </div>
    <div class="widget-bar"><div id="fill" class="widget-fill"></div></div>
  </div>

  <script src="/overlay.js"></script>
</body>
</html>
